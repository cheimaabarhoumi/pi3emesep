<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CSS Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Test CSS Validation Styles</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test 1: Manual CSS Classes</h3>
                <div class="form-group">
                    <label>Test Field</label>
                    <input type="text" class="form-control is-invalid" value="This should have red border">
                    <div class="validation-error-message text-danger small mt-1 fv-error">
                        <i class="fas fa-exclamation-circle me-1"></i>This is a test error message
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Test 2: Form with Validation</h3>
                <form id="admin-voiture-form">
                    <div class="form-group">
                        <label>Marque *</label>
                        <input type="text" class="form-control" name="voiture[marque]" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Test Submit</button>
                </form>
            </div>
        </div>
        
        <div class="mt-4">
            <h4>What you should see:</h4>
            <ul>
                <li>Test 1: A red-bordered input field with an error message above it</li>
                <li>Test 2: A form that should show validation errors when submitted empty</li>
            </ul>
        </div>
    </div>

    <style>
        /* Inline CSS to test validation styles */
        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .validation-error-message {
            color: #dc3545 !important;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            display: block;
            font-weight: 500;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        
        .fv-error {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(220, 53, 69, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border-left: 3px solid #dc3545;
        }
    </style>

    <script src="build/app.bcc58c50.js"></script>
</body>
</html>
