<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Validation - Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-group { margin-bottom: 1.5rem; }
        .validation-error-message {
            color: #dc3545 !important;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            display: block;
            font-weight: 500;
        }
        .form-control.is-invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        .fv-error {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(220, 53, 69, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border-left: 3px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Validation Debug</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test Form 1</h3>
                <form id="admin-voiture-form">
                    <div class="form-group">
                        <label>Marque *</label>
                        <input type="text" class="form-control" name="voiture[marque]" required>
                    </div>
                    <div class="form-group">
                        <label>Modèle *</label>
                        <input type="text" class="form-control" name="voiture[modele]" required>
                    </div>
                    <div class="form-group">
                        <label>Année *</label>
                        <input type="number" class="form-control" name="voiture[annee]" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Test Submit</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <h3>Test Form 2</h3>
                <form class="neo-form">
                    <div class="form-group">
                        <label>Marque *</label>
                        <input type="text" class="form-control" name="marque" required>
                    </div>
                    <div class="form-group">
                        <label>Modèle *</label>
                        <input type="text" class="form-control" name="modele" required>
                    </div>
                    <button type="submit" class="btn btn-success">Test Submit</button>
                </form>
            </div>
        </div>
        
        <div class="mt-4">
            <h4>Debug Info:</h4>
            <div id="debug-info"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/form-validation.js"></script>
    <script>
        // Additional debugging
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, checking for forms...');
            const forms = document.querySelectorAll('form');
            console.log('Forms found:', forms.length);
            
            forms.forEach((form, index) => {
                console.log(`Form ${index}:`, form.id || 'no-id', form.className);
            });
        });
    </script>
</body>
</html>
