<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Validation Simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-group { margin-bottom: 1.5rem; }
        .validation-error-message {
            color: #dc3545 !important;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            display: block;
            font-weight: 500;
        }
        .form-control.is-invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        .fv-error {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(220, 53, 69, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border-left: 3px solid #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Validation Simple</h1>
        
        <form id="admin-voiture-form">
            <div class="form-group">
                <label>Marque *</label>
                <input type="text" class="form-control" name="voiture[marque]" required>
            </div>
            <div class="form-group">
                <label>Modèle *</label>
                <input type="text" class="form-control" name="voiture[modele]" required>
            </div>
            <div class="form-group">
                <label>Année *</label>
                <input type="number" class="form-control" name="voiture[annee]" required>
            </div>
            <button type="submit" class="btn btn-primary">Test Submit</button>
        </form>
        
        <div class="mt-4">
            <h4>Instructions:</h4>
            <ol>
                <li>Try to submit the form without filling any fields</li>
                <li>You should see red error messages above each field</li>
                <li>Check the browser console for debug messages</li>
            </ol>
        </div>
    </div>

    <script src="build/app.bcc58c50.js"></script>
</body>
</html>
